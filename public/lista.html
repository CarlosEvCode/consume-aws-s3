<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Archivos S3</title>
    <style>
        body {
            background: #ffffff;
            color: #111111;
            font-family: monospace;
            padding: 20px;
        }
        a {
            color: #0066cc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }
        th {
            background: #f5f5f5;
        }
        .btn-download {
            background: #ffffff;
            border: 1px solid #0066cc;
            color: #0066cc;
            font-family: monospace;
            cursor: pointer;
            padding: 4px 8px;
            text-decoration: none;
            display: inline-block;
            margin-right: 5px;
        }
        .btn-download:hover {
            background: #0066cc;
            color: #ffffff;
        }
        .btn-delete {
            background: #ffffff;
            border: 1px solid #cc0000;
            color: #cc0000;
            font-family: monospace;
            cursor: pointer;
            padding: 4px 8px;
        }
        .btn-delete:hover {
            background: #cc0000;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <h2>Archivos S3</h2>
    <p><a href="/">Subir otro archivo</a></p>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Tamaño</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>

    <script>
        function cargarArchivos() {
            fetch('/api/lista')
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('tabla');
                    tbody.innerHTML = (data.archivos || []).map(a => `
                        <tr>
                            <td>${a.nombre}</td>
                            <td>${a.tamanio} B</td>
                            <td>${new Date(a.fecha).toLocaleString()}</td>
                            <td>
                                <a class="btn-download" href="/api/descargar?key=${encodeURIComponent(a.key)}">Descargar</a>
                                <button class="btn-delete" onclick="eliminarArchivo('${a.key}')">Eliminar</button>
                            </td>
                        </tr>
                    `).join('');
                });
        }

        function eliminarArchivo(key) {
            if (confirm('¿Eliminar archivo?')) {
                fetch('/api/eliminar?key=' + encodeURIComponent(key), {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        cargarArchivos();
                    } else {
                        alert(data.message);
                    }
                });
            }
        }

        cargarArchivos();
    </script>
</body>
</html>
